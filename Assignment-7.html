<!DOCTYPE html>
<html>
<head>
    <title>Assignment 7: Navigation Menu Using Lists</title>
    <style>
        nav ul 
        { list-style: none; 
                 margin: 0; 
                 padding: 0;    
                 background: cadetblue; 
                 overflow: hidden; }
        nav li 
        { float: left;
         }
        nav a 
        { display: block;
          color: rgb(31, 29, 29);
          padding: 9px 18px; 
          text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
